name: scrape catalog

on:
  schedule:
    - cron: "0 14 * * *" # daily 14:00 UTC (6-7am Pacific)
  workflow_dispatch:
    inputs:
      terms:
        description: "Registrar terms, space-separated, e.g. WI2026-27 (default: the two newest terms in src/courseData.ts)"
        required: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Pick terms
        id: terms
        env:
          INPUT_TERMS: ${{ inputs.terms }}
        run: |
          if [ -n "$INPUT_TERMS" ]; then
            terms="$INPUT_TERMS"
          else
            # the newest term is still being registered for, and the one
            # before it is in session, so both can still change
            terms=$(grep -oE 'IndexedTotal(FA|WI|SP)[0-9]{4}-[0-9]{2}' src/courseData.ts \
              | sed 's/IndexedTotal//' | tail -2 | tr '\n' ' ')
          fi
          echo "terms=$terms" >> "$GITHUB_OUTPUT"
          echo "Scraping: $terms"

      - name: Scrape
        run: |
          failed=0
          for term in ${{ steps.terms.outputs.terms }}; do
            # keep going if one term fails so the others still update
            node scripts/scrape-schedule.mjs "$term" || failed=1
          done
          exit $failed

      - name: Commit if changed
        # commit whatever did update even if one term failed
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          changed=$(git diff --name-only | grep -oE '(FA|WI|SP)[0-9]{4}-[0-9]{2}' | tr '\n' ' ')
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git commit -am "update ${changed% } catalog from registrar"
          git push
